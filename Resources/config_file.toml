approval_policy = "approved_only"
required_capabilities = [
    "browser_retrieval",
    "resource_synthesis",
    "workspace_file_access",
    "document_generation",
    "spreadsheet_generation",
    "presentation_generation"
]
enabled_tools = []

[constraints]
